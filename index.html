<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkNow Pro</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; overflow: hidden; }
        html { height: -webkit-fill-available; }

        header { background-color: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; height: 55px; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
        
        .controls-top { display: flex; gap: 8px; align-items: center; }
        select, button, input { background-color: #334155; color: var(--text-main); border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button.primary { background-color: var(--accent); font-weight: 600; }
        button.primary:hover { background-color: var(--accent-hover); }

        .main-container { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; height: calc(100vh - 55px); overflow: hidden; }

        /* Відеосітка адаптована під мобільні */
        .video-grid { flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
        @media(min-width: 768px) { .video-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; } }

        .video-wrapper { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #334155; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; background-color: #000; transform: scaleX(-1); }
        #remoteVideo { transform: none; }
        .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(15, 23, 42, 0.7); padding: 4px 8px; border-radius: 12px; font-size: 11px; backdrop-filter: blur(4px); max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Текстовий Чат */
        .chat-box { height: 110px; background: var(--bg-card); border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 8px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; background: transparent; border-radius: 0; padding: 8px; }
        .chat-input-area button { border-radius: 0; background: var(--accent); width: 60px; }

        /* Нижня панель */
        .action-bar { display: flex; justify-content: center; gap: 10px; padding: 5px 0; align-items: center; }
        .circle-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; background: #334155; }

        /* Модальні вікна (Реєстрація та Налаштування) */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); padding: 15px; }
        .modal-card { background: var(--bg-card); padding: 20px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; border: 1px solid #475569; max-height: 90vh; overflow-y: auto; }
        
        .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto 10px; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: #334155; }
        
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; background: #0f172a; border: 1px solid #475569; padding: 10px; border-radius: 8px; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>TalkNow Pro</h1>
        <div class="controls-top">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="uk">🇺🇦 UA</option>
                <option value="en">🇺🇸 EN</option>
                <option value="ru">🇷🇺 RU</option>
            </select>
            <button id="btnSettings" onclick="openSettings()" style="background: transparent; font-size: 18px; padding: 4px;">⚙️</button>
        </div>
    </header>

    <div class="main-container">
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label" id="lblMe">Я</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="lblPartner">Співрозмовник</div>
            </div>
        </div>

        <!-- Текстовий чат -->
        <div class="chat-box">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Напишіть повідомлення...">
                <button onclick="sendChatMessage()">➡️</button>
            </div>
        </div>

        <div class="action-bar">
            <button id="btnFlip" class="circle-btn">🔄</button>
            <button id="btnNext" class="primary" style="padding: 0 25px; height: 44px; border-radius: 22px; font-size: 15px;" onclick="nextPartner()">Пошук / Наступний ➡️</button>
        </div>
    </div>

    <!-- Модалка реєстрації / входу -->
    <div class="modal" id="profileModal">
        <div class="modal-card">
            <h2 id="modalTitle" style="margin-bottom: 15px; font-size: 18px;">Вхід або Реєстрація</h2>
            
            <div class="avatar-container">
                <img id="avatarImg" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>">
            </div>
            
            <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 15px;">
                <label class="primary" style="padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer;">
                    📂 <span id="btnGallery">Галерея</span>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadAvatarFile(event)">
                </label>
                <button type="button" style="font-size: 12px;" onclick="snapAvatar()">📸 <span id="btnSnap">Зробити фото</span></button>
            </div>

            <div class="input-group">
                <label id="lblUsername">Твоє Ім'я</label>
                <input type="text" id="usernameInput" value="Користувач">
            </div>

            <div class="input-group">
                <label id="lblGender">Стать</label>
                <select id="genderInput">
                    <option value="Чоловік" id="optMale">Чоловік</option>
                    <option value="Жінка" id="optFemale">Жінка</option>
                </select>
            </div>

            <div class="input-group">
                <label id="lblAge">Вік</label>
                <input type="number" id="ageInput" value="18" min="12" max="99">
            </div>

            <button class="primary" style="width: 100%; padding: 10px; margin-top: 5px;" onclick="saveProfile()" id="btnSave">Вхід / Реєстрація</button>
        </div>
    </div>

    <script>
        const translations = {
            uk: { lblMe: "Я", lblPartner: "Співрозмовник", btnNext: "Пошук / Наступний ➡️", modalTitle: "Вхід або Реєстрація", btnGallery: "Галерея", btnSnap: "Зробити фото", lblUsername: "Твоє Ім'я", lblGender: "Стать", optMale: "Чоловік", optFemale: "Жінка", lblAge: "Вік", btnSave: "Вхід / Реєстрація", statusWaiting: "Пошук людини...", statusConnected: "Співрозмовник: ", placeholder: "Напишіть повідомлення..." },
            en: { lblMe: "Me", lblPartner: "Partner", btnNext: "Search / Next ➡️", modalTitle: "Login or Sign Up", btnGallery: "Gallery", btnSnap: "Take Photo", lblUsername: "Your Name", lblGender: "Gender", optMale: "Male", optFemale: "Female", lblAge: "Age", btnSave: "Login / Sign Up", statusWaiting: "Searching for someone...", statusConnected: "Partner: ", placeholder: "Type a message..." },
            ru: { lblMe: "Я", lblPartner: "Собеседник", btnNext: "Поиск / Следующий ➡️", modalTitle: "Вход или Регистрация", btnGallery: "Галерея", btnSnap: "Сделать фото", lblUsername: "Твое Имя", lblGender: "Пол", optMale: "Мужчина", optFemale: "Женщина", lblAge: "Возраст", btnSave: "Вход / Регистрация", statusWaiting: "Поиск собеседника...", statusConnected: "Собеседник: ", placeholder: "Напишите сообщение..." }
        };

        let currentLang = 'uk';
        let localStream;
        let peerConnection;
        let socket;
        let myId = Math.random().toString(36).substr(2, 9);
        let myAvatarData = "";
        let currentFacingMode = "user";

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const t = translations[currentLang];
            document.getElementById('lblMe').innerText = t.lblMe;
            document.getElementById('btnNext').innerText = t.btnNext;
            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('btnGallery').innerText = t.btnGallery;
            document.getElementById('btnSnap').innerText = t.btnSnap;
            document.getElementById('lblUsername').innerText = t.lblUsername;
            document.getElementById('lblGender').innerText = t.lblGender;
            document.getElementById('optMale').innerText = t.optMale;
            document.getElementById('optFemale').innerText = t.optFemale;
            document.getElementById('lblAge').innerText = t.lblAge;
            document.getElementById('btnSave').innerText = t.btnSave;
            document.getElementById('chatInput').placeholder = t.placeholder;
        }

        async function initCamera() {
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) { console.error("Камера недоступна:", e); }
        }

        document.getElementById('btnFlip').onclick = async () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            await initCamera();
            if (peerConnection) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            }
        };

        function loadAvatarFile(event) {
            const reader = new FileReader();
            reader.onload = function() {
                myAvatarData = reader.result;
                document.getElementById('avatarImg').src = myAvatarData;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function snapAvatar() {
            const video = document.getElementById('localVideo');
            const canvas = document.createElement('canvas');
            canvas.width = 150; canvas.height = 150;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, (video.videoWidth-video.videoHeight)/2, 0, video.videoHeight, video.videoHeight, 0, 0, 150, 150);
            myAvatarData = canvas.toDataURL('image/jpeg');
            document.getElementById('avatarImg').src = myAvatarData;
        }

        function openSettings() {
            document.getElementById('profileModal').style.display = 'flex';
        }

        function saveProfile() {
            document.getElementById('profileModal').style.display = 'none';
            if (!socket) {
                initWebSocket();
            } else if (socket.readyState === WebSocket.OPEN) {
                // Оновлення профілю на льоту
                const profile = getProfileData();
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: profile }));
            }
        }

        function getProfileData() {
            return {
                name: document.getElementById('usernameInput').value,
                gender: document.getElementById('genderInput').value,
                age: document.getElementById('ageInput').value,
                avatar: myAvatarData
            };
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: getProfileData() }));
            };

            socket.onmessage = async (message) => {
                const data = JSON.parse(message.data);

                if (data.type === 'waiting') {
                    document.getElementById('lblPartner').innerText = translations[currentLang].statusWaiting;
                }

                if (data.type === 'connected') {
                    const p = data.partnerProfile;
                    document.getElementById('lblPartner').innerText = `${translations[currentLang].statusConnected} ${p.name} (${p.gender}, ${p.age})`;
                    appendChatMessage("Система", "Ви підключилися до співрозмовника!");
                    startCall(true);
                }

                if (data.type === 'partner_disconnected') {
                    appendChatMessage("Система", "Співрозмовник відключився.");
                    closeCall();
                }

                if (data.type === 'chat_message') {
                    appendChatMessage("Співрозмовник", data.text);
                }

                if (data.type === 'offer') {
                    await startCall(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify(peerConnection.localDescription));
                }

                if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }

                if (data.type === 'candidate') {
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            };
        }

        async function startCall(isCaller) {
            peerConnection = new RTCPeerConnection(configuration);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify(peerConnection.localDescription));
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'message', text: text }));
                appendChatMessage("Я", text);
                input.value = "";
            }
        }

        function appendChatMessage(sender, text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function nextPartner() {
            closeCall();
            document.getElementById('chatMessages').innerHTML = "";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'next' }));
            }
        }

        function closeCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('lblPartner').innerText = translations[currentLang].lblPartner;
        }

        // Запуск камери відразу
        initCamera();
        
        // Відправка повідомлень по натисканню Enter
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendChatMessage();
        });
    </script>
</body>
</html>
