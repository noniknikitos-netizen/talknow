<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkNow Pro 18+</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { background-color: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; height: 55px; }
        header h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
        .badge-18 { background: var(--danger); color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 5px; }

        .controls-top { display: flex; gap: 8px; align-items: center; }
        select, button, input, textarea { background-color: #334155; color: var(--text-main); border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button.primary { background-color: var(--accent); font-weight: 600; }
        button.primary:hover { background-color: var(--accent-hover); }
        button.danger { background-color: var(--danger); }

        .main-container { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; height: calc(100vh - 55px); overflow: hidden; }

        .video-grid { flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 0; }
        @media(min-width: 768px) { .video-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; } }

        .video-wrapper { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #334155; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; background-color: #000; transform: scaleX(-1); }
        #remoteVideo { transform: none; }
        .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(15, 23, 42, 0.8); padding: 6px 12px; border-radius: 12px; font-size: 12px; backdrop-filter: blur(4px); max-width: 90%; line-height: 1.4; }

        .chat-box { height: 110px; background: var(--bg-card); border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
        .chat-messages { flex: 1; padding: 8px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid #334155; }
        .chat-input-area input { flex: 1; background: transparent; border-radius: 0; padding: 8px; }
        .chat-input-area button { border-radius: 0; background: var(--accent); width: 60px; }

        .action-bar { display: flex; justify-content: center; gap: 10px; padding: 5px 0; align-items: center; }
        .circle-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; background: #334155; }
        .circle-btn.off { background: var(--danger); }

        /* Модальні вікна */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.96); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); padding: 15px; }
        .modal-card { background: var(--bg-card); padding: 20px; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid #475569; max-height: 95vh; overflow-y: auto; position: relative; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .tab { flex: 1; padding: 8px; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 6px; }
        .tab.active { background: #334155; color: #fff; }

        .avatar-container { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: #334155; }
        
        .input-group { margin-bottom: 10px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; background: #0f172a; border: 1px solid #475569; padding: 10px; border-radius: 8px; color: #fff; }
        .input-group textarea { resize: none; height: 50px; font-size: 13px; }

        .captcha-box { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px; border-radius: 8px; margin-bottom: 12px; justify-content: space-between; }
        .captcha-num { font-size: 18px; font-weight: bold; letter-spacing: 5px; color: var(--accent); background: #1e293b; padding: 4px 10px; border-radius: 4px; user-select: none; }
        
        .close-modal { position: absolute; top: 12px; right: 15px; font-size: 20px; background: transparent; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center;">
            <h1>TalkNow Pro</h1>
            <span class="badge-18">18+</span>
        </div>
        <div class="controls-top">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="uk">🇺🇦 UA</option>
                <option value="en">🇺🇸 EN</option>
                <option value="ru">🇷🇺 RU</option>
            </select>
            <button id="btnSettings" onclick="openSettings()" style="background: transparent; font-size: 18px; padding: 4px;">⚙️</button>
        </div>
    </header>

    <div class="main-container">
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label" id="lblMe">Я</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="lblPartner">Співрозмовник</div>
            </div>
        </div>

        <div class="chat-box">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Напишіть повідомлення...">
                <button onclick="sendChatMessage()">➡️</button>
            </div>
        </div>

        <div class="action-bar">
            <button id="btnAudio" class="circle-btn" onclick="toggleAudio()">🎙️</button>
            <button id="btnVideo" class="circle-btn" onclick="toggleVideo()">📹</button>
            <button id="btnFlip" class="circle-btn">🔄</button>
            <button id="btnNext" class="primary" style="padding: 0 20px; height: 44px; border-radius: 22px;" onclick="nextPartner()">Наступний ➡️</button>
        </div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-card">
            <div class="tabs">
                <button class="tab active" onclick="setAuthMode('login')" id="tabLogin">Вхід</button>
                <button class="tab" onclick="setAuthMode('register')" id="tabRegister">Реєстрація</button>
            </div>

            <div id="regAvatarBlock">
                <div class="avatar-container">
                    <img id="avatarImg" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>">
                </div>
                <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;">
                    <label class="primary" style="padding: 5px 10px; font-size: 11px; border-radius: 6px; cursor: pointer;">
                        📂 <span id="btnGallery">Галерея</span>
                        <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadAvatarFile(event, 'avatarImg')">
                    </label>
                    <button type="button" style="font-size: 11px;" onclick="snapAvatar('avatarImg')">📸 <span>Зробити фото</span></button>
                </div>
            </div>

            <div class="input-group">
                <label>Логін / Ім'я</label>
                <input type="text" id="usernameInput" placeholder="Введіть ваш логін">
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введіть пароль">
            </div>

            <div id="regFields">
                <div class="input-group">
                    <label>Стать</label>
                    <select id="genderInput">
                        <option value="Чоловік">Чоловік</option>
                        <option value="Жінка">Жінка</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Вік (Тільки 18+)</label>
                    <input type="number" id="ageInput" value="18" min="18" max="99">
                </div>
                <div class="input-group">
                    <label>Про себе</label>
                    <textarea id="aboutInput" placeholder="Хобі, інтереси, що шукаєте..."></textarea>
                </div>
            </div>

            <div class="captcha-box">
                <div class="captcha-num" id="captchaCode">1234</div>
                <input type="text" id="captchaInput" placeholder="Код" style="width: 100px; padding: 8px;">
            </div>

            <button class="primary" style="width: 100%; padding: 12px;" onclick="submitAuth()" id="btnSave">Увійти</button>
        </div>
    </div>

    <div class="modal" id="settingsModal" style="display: none;">
        <div class="modal-card">
            <button class="close-modal" onclick="closeSettings()">✕</button>
            <h2 style="margin-bottom: 15px; font-size: 18px; text-align: center;">Редагувати Профіль</h2>

            <div class="avatar-container">
                <img id="settingsAvatarImg" class="avatar-preview" src="">
            </div>
            <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;">
                <label class="primary" style="padding: 5px 10px; font-size: 11px; border-radius: 6px; cursor: pointer;">
                    📂 <span>Галерея</span>
                    <input type="file" id="fileInputSettings" accept="image/*" style="display:none;" onchange="loadAvatarFile(event, 'settingsAvatarImg')">
                </label>
                <button type="button" style="font-size: 11px;" onclick="snapAvatar('settingsAvatarImg')">📸 <span>Зробити фото</span></button>
            </div>

            <div class="input-group">
                <label>Ім'я в чаті</label>
                <input type="text" id="settName">
            </div>
            <div class="input-group">
                <label>Змінити пароль</label>
                <input type="password" id="settPassword" placeholder="Новий пароль">
            </div>
            <div class="input-group">
                <label>Про себе</label>
                <textarea id="settAbout"></textarea>
            </div>

            <button class="primary" style="width: 100%; padding: 10px; margin-bottom: 10px;" onclick="saveSettingsChanges()">Зберегти зміни</button>
            <button class="danger" style="width: 100%; padding: 10px;" onclick="logout()">Вийти з акаунта 🚪</button>
        </div>
    </div>

    <script>
        const translations = {
            uk: { lblMe: "Я", lblPartner: "Співрозмовник", btnNext: "Наступний ➡️", tabLogin: "Вхід", tabRegister: "Реєстрація", badCaptcha: "Невірний код капчі!", alert18: "Вхід дозволено лише особам від 18 років!", badLogin: "Невірний логін або пароль!" },
            en: { lblMe: "Me", lblPartner: "Partner", btnNext: "Next ➡️", tabLogin: "Login", tabRegister: "Register", badCaptcha: "Invalid captcha!", alert18: "Access allowed only for 18+!", badLogin: "Wrong username or password!" },
            ru: { lblMe: "Я", lblPartner: "Собеседник", btnNext: "Следующий ➡️", tabLogin: "Вход", tabRegister: "Регистрация", badCaptcha: "Неверный код капчи!", alert18: "Вход разрешен только с 18 лет!", badLogin: "Неверный логин или password!" }
        };

        let currentLang = 'uk';
        let localStream;
        let peerConnection;
        let socket;
        let myId = Math.random().toString(36).substr(2, 9);
        let myAvatarData = "";
        let authMode = "login";
        let generatedCaptcha = "";

        // СПЕЦІАЛЬНІ ПУБЛІЧНІ TURN СЕРВЕРИ ДЛЯ ПРОБИТТЯ БУДЬ-ЯКОГО ІНТЕРНЕТУ МІЖ ПК ТА ТЕЛЕФОНОМ
        const configuration = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:turn.bistri.com:80', username: 'bistri', credential: 'bistri' },
                { urls: 'turn:anyfirewall.com:3478', username: 'anyfirewall', credential: 'anyfirewall' }
            ] 
        };

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            document.getElementById('lblMe').innerText = translations[currentLang].lblMe;
            document.getElementById('btnNext').innerText = translations[currentLang].btnNext;
            document.getElementById('tabLogin').innerText = translations[currentLang].tabLogin;
            document.getElementById('tabRegister').innerText = translations[currentLang].tabRegister;
        }

        function setAuthMode(mode) {
            authMode = mode;
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
            document.getElementById('regFields').style.display = mode === 'login' ? 'none' : 'block';
            document.getElementById('regAvatarBlock').style.display = mode === 'login' ? 'none' : 'block';
            document.getElementById('btnSave').innerText = mode === 'login' ? 'Увійти' : 'Зареєструватися';
        }

        function generateCaptcha() {
            generatedCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('captchaCode').innerText = generatedCaptcha;
        }

        function checkLocalStorage() {
            const saved = localStorage.getItem('talknow_account');
            if (saved) {
                setAuthMode('login');
            } else {
                setAuthMode('register');
            }
        }

        function submitAuth() {
            if (document.getElementById('captchaInput').value.trim() !== generatedCaptcha) {
                alert(translations[currentLang].badCaptcha);
                generateCaptcha();
                return;
            }

            const name = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value;
            const age = parseInt(document.getElementById('ageInput').value);

            if (authMode === 'register') {
                if (age < 18 || isNaN(age)) {
                    alert(translations[currentLang].alert18);
                    return;
                }
                const account = {
                    name: name || "Анонім", password: pass, age: age,
                    gender: document.getElementById('genderInput').value,
                    about: document.getElementById('aboutInput').value, avatar: myAvatarData
                };
                localStorage.setItem('talknow_account', JSON.stringify(account));
                enterChat(account);
            } else {
                const saved = JSON.parse(localStorage.getItem('talknow_account'));
                if (saved && saved.name === name && saved.password === pass) {
                    enterChat(saved);
                } else {
                    alert(translations[currentLang].badLogin);
                }
            }
        }

        function enterChat(account) {
            document.getElementById('authModal').style.display = 'none';
            initWebSocket(account);
        }

        function openSettings() {
            const saved = JSON.parse(localStorage.getItem('talknow_account'));
            if (!saved) return;
            document.getElementById('settName').value = saved.name;
            document.getElementById('settPassword').value = saved.password;
            document.getElementById('settAbout').value = saved.about || "";
            document.getElementById('settingsAvatarImg').src = saved.avatar || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettingsChanges() {
            const saved = JSON.parse(localStorage.getItem('talknow_account'));
            saved.name = document.getElementById('settName').value;
            saved.password = document.getElementById('settPassword').value;
            saved.about = document.getElementById('settAbout').value;
            saved.avatar = document.getElementById('settingsAvatarImg').src;
            localStorage.setItem('talknow_account', JSON.stringify(saved));
            closeSettings();
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: saved }));
            }
        }

        function logout() {
            localStorage.removeItem('talknow_account');
            location.reload();
        }

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) { alert("Будь ласка, дозвольте доступ до камери та мікрофона."); }
        }

        function toggleAudio() {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                document.getElementById('btnAudio').classList.toggle('off', !track.enabled);
                document.getElementById('btnAudio').innerText = track.enabled ? "🎙️" : "🔇";
            }
        }

        function toggleVideo() {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                document.getElementById('btnVideo').classList.toggle('off', !track.enabled);
                document.getElementById('btnVideo').innerText = track.enabled ? "📹" : "🚫";
            }
        }

        function loadAvatarFile(event, targetImgId) {
            const reader = new FileReader();
            reader.onload = function() {
                myAvatarData = reader.result;
                document.getElementById(targetImgId).src = myAvatarData;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function snapAvatar(targetImgId) {
            const video = document.getElementById('localVideo');
            const canvas = document.createElement('canvas');
            canvas.width = 150; canvas.height = 150;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, (video.videoWidth-video.videoHeight)/2, 0, video.videoHeight, video.videoHeight, 0, 0, 150, 150);
            myAvatarData = canvas.toDataURL('image/jpeg');
            document.getElementById(targetImgId).src = myAvatarData;
        }

        function initWebSocket(profile) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: profile }));
            };

            socket.onmessage = async (message) => {
                const data = JSON.parse(message.data);

                if (data.type === 'waiting') {
                    document.getElementById('lblPartner').innerText = "Шукаємо когось цікавого...";
                }

                if (data.type === 'connected') {
                    const p = data.partnerProfile;
                    document.getElementById('lblPartner').innerHTML = `<strong>${p.name} (${p.gender}, ${p.age} р.)</strong><br><small style="color:var(--text-muted)">${p.about || 'Без опису'}</small>`;
                    appendChatMessage("Система", `Ви підключилися до ${p.name}!`);
                    startCall(true);
                }

                if (data.type === 'partner_disconnected') {
                    appendChatMessage("Система", "Співрозмовник вийшов.");
                    closeCall();
                }

                if (data.type === 'chat_message') {
                    appendChatMessage("Співрозмовник", data.text);
                }

                if (data.type === 'offer') {
                    await startCall(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify(peerConnection.localDescription));
                }

                if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }

                if (data.type === 'candidate') {
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            };
        }

        async function startCall(isCaller) {
            peerConnection = new RTCPeerConnection(configuration);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify(peerConnection.localDescription));
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'message', text: text }));
                appendChatMessage("Я", text);
                input.value = "";
            }
        }

        function appendChatMessage(sender, text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function nextPartner() {
            closeCall();
            document.getElementById('chatMessages').innerHTML = "";
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'next' }));
            }
        }

        function closeCall() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('lblPartner').innerText = "Співрозмовник";
        }

        initCamera();
        checkLocalStorage();
        generateCaptcha();
        document.getElementById('chatInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendChatMessage(); });
    </script>
</body>
</html>
