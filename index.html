<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkNow Pro</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { background-color: var(--bg-card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 20px; font-weight: 700; color: var(--accent); }
        
        .controls-top { display: flex; gap: 10px; align-items: center; }
        select, button { background-color: #334155; color: var(--text-main); border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        button.primary { background-color: var(--accent); font-weight: 600; }
        button.primary:hover { background-color: var(--accent-hover); }
        button.danger { background-color: var(--danger); }

        .main-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; position: relative; }

        /* Відеосітка з виправленим масштабуванням камери */
        .video-grid { flex: 1; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 15px; }
        @media(min-width: 768px) { .video-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; } }

        .video-wrapper { background-color: var(--bg-card); border-radius: 16px; overflow: hidden; position: relative; border: 2px solid #334155; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        
        /* Властивість object-fit: contain фіксить наближення камери на телефонах */
        video { width: 100%; height: 100%; object-fit: contain; background-color: #000; transform: scaleX(-1); }
        #remoteVideo { transform: none; }

        .video-label { position: absolute; bottom: 15px; left: 15px; background: rgba(15, 23, 42, 0.7); padding: 6px 12px; border-radius: 20px; font-size: 12px; backdrop-filter: blur(4px); }

        /* Панель налаштувань профілю */
        .profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .profile-card { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #475569; }
        .avatar-container { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); background: #334155; }
        .avatar-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .avatar-buttons label, .avatar-buttons button { padding: 6px 10px; font-size: 11px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .input-group input { width: 100%; background: #0f172a; border: 1px solid #475569; padding: 12px; border-radius: 10px; color: #fff; }

        /* Нижня панель кнопок */
        .action-bar { display: flex; justify-content: center; gap: 15px; padding: 10px 0; }
        .circle-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; background: #334155; }
        .circle-btn:hover { background: #475569; }
        .circle-btn.active { background: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>TalkNow Pro</h1>
        <div class="controls-top">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="uk">🇺🇦 UA</option>
                <option value="en">🇺🇸 EN</option>
                <option value="ru">🇷🇺 RU</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label" id="lblMe">Я</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="lblPartner">Співрозмовник</div>
            </div>
        </div>

        <div class="action-bar">
            <button id="btnFlip" class="circle-btn" title="Переключити камеру">🔄</button>
            <button id="btnNext" class="primary" style="padding: 0 30px; border-radius: 25px; font-size: 16px;" onclick="nextPartner()">Пошук / Наступний ➡️</button>
        </div>
    </div>

    <!-- Модалка налаштування профілю -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-card">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Твій Профіль</h2>
            
            <div class="avatar-container">
                <img id="avatarImg" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>" alt="Avatar">
            </div>
            
            <div class="avatar-buttons">
                <label class="primary" style="display:inline-block; border-radius:8px; cursor:pointer;">
                    📂 <span id="btnGallery">Галерея</span>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="loadAvatarFile(event)">
                </label>
                <button type="button" onclick="snapAvatar()">📸 <span id="btnSnap">Зробити фото</span></button>
            </div>

            <div class="input-group" style="margin-top:20px;">
                <label id="lblUsername">Твоє Ім'я</label>
                <input type="text" id="usernameInput" value="User">
            </div>

            <button class="primary" style="width: 100%; padding: 12px;" onclick="saveProfile()" id="btnSave">Зберегти та увійти</button>
        </div>
    </div>

    <script>
        const translations = {
            uk: { lblMe: "Я", lblPartner: "Співрозмовник", btnNext: "Пошук / Наступний ➡️", modalTitle: "Твій Профіль", btnGallery: "Галерея", btnSnap: "Зробити фото", lblUsername: "Твоє Ім'я", btnSave: "Зберегти та увійти", statusWaiting: "Пошук людини...", statusConnected: "Підключено до: " },
            en: { lblMe: "Me", lblPartner: "Partner", btnNext: "Search / Next ➡️", modalTitle: "Your Profile", btnGallery: "Gallery", btnSnap: "Take Photo", lblUsername: "Your Name", btnSave: "Save and Enter", statusWaiting: "Searching for someone...", statusConnected: "Connected to: " },
            ru: { lblMe: "Я", lblPartner: "Собеседник", btnNext: "Поиск / Следующий ➡️", modalTitle: "Твой Профиль", btnGallery: "Галерея", btnSnap: "Сделать фото", lblUsername: "Твое Имя", btnSave: "Сохранить и войти", statusWaiting: "Поиск собеседника...", statusConnected: "Подключено к: " }
        };

        let currentLang = 'uk';
        let localStream;
        let peerConnection;
        let socket;
        let myId = Math.random().toString(36).substr(2, 9);
        let myAvatarData = "";
        let currentFacingMode = "user"; // 'user' = фронтальна, 'environment' = задня

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const t = translations[currentLang];
            document.getElementById('lblMe').innerText = t.lblMe;
            document.getElementById('btnNext').innerText = t.btnNext;
            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('btnGallery').innerText = t.btnGallery;
            document.getElementById('btnSnap').innerText = t.btnSnap;
            document.getElementById('lblUsername').innerText = t.lblUsername;
            document.getElementById('btnSave').innerText = t.btnSave;
        }

        async function initCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            try {
                // Вказуємо facingMode для перемикання камер (фронт/зад)
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                console.error("Помилка доступу до камери:", e);
            }
        }

        // Кнопка перемикання камери
        document.getElementById('btnFlip').onclick = async () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            await initCamera();
            if (peerConnection) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
                if (sender) sender.replaceTrack(videoTrack);
            }
        };

        function loadAvatarFile(event) {
            const reader = new FileReader();
            reader.onload = function() {
                myAvatarData = reader.result;
                document.getElementById('avatarImg').src = myAvatarData;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function snapAvatar() {
            const video = document.getElementById('localVideo');
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            // Малюємо квадратний кадр з центру відео
            ctx.drawImage(video, (video.videoWidth-video.videoHeight)/2, 0, video.videoHeight, video.videoHeight, 0, 0, 200, 200);
            myAvatarData = canvas.toDataURL('image/jpeg');
            document.getElementById('avatarImg').src = myAvatarData;
        }

        function saveProfile() {
            document.getElementById('profileModal').style.display = 'none';
            initWebSocket();
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                const profile = {
                    name: document.getElementById('usernameInput').value,
                    avatar: myAvatarData
                };
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: profile }));
            };

            socket.onmessage = async (message) => {
                const data = JSON.parse(message.data);

                if (data.type === 'waiting') {
                    document.getElementById('lblPartner').innerText = translations[currentLang].statusWaiting;
                }

                if (data.type === 'connected') {
                    const p = data.partnerProfile;
                    document.getElementById('lblPartner').innerText = `${translations[currentLang].statusConnected} ${p.name}`;
                    startCall(true);
                }

                if (data.type === 'partner_disconnected') {
                    closeCall();
                }

                if (data.type === 'offer') {
                    await startCall(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify(peerConnection.localDescription));
                }

                if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }

                if (data.type === 'candidate') {
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    }
                }
            };
        }

        async function startCall(isCaller) {
            peerConnection = new RTCPeerConnection(configuration);
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify(peerConnection.localDescription));
            }
        }

        function nextPartner() {
            closeCall();
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'next' }));
            }
        }

        function closeCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('lblPartner').innerText = translations[currentLang].lblPartner;
        }

        // Старт камери при завантаженні для створення аватарки
        initCamera();
    </script>
</body>
</html>
