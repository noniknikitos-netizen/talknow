<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TalkNow Pro — Стабільний Зв'язок</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff4a5a;
            --success: #10b981;
            --dev-color: #a855f7;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
        }

        .app-wrapper {
            display: flex;
            flex: 1;
            width: 100vw;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .side-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--success);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .search-options {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .option-group { display: flex; flex-direction: column; gap: 4px; }

        select, input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000;
            height: 100%;
        }

        .video-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #05070f;
        }

        .local-video-wrapper {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 105px;
            height: 140px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #000;
            z-index: 5;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .partner-info-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(17, 24, 39, 0.85);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 4;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bottom-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 4;
            padding: 0 16px;
        }

        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(31, 41, 55, 0.9);
            color: #fff;
            font-size: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .btn-circle.off { background-color: var(--danger); }

        .btn-primary {
            height: 50px;
            flex: 1;
            max-width: 240px;
            border-radius: 25px;
            background: var(--accent-gradient);
            color: #000;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .developer-badge {
            display: none;
            position: absolute;
            bottom: 85px;
            right: 16px;
            background: var(--dev-color);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 6;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .dev-console {
            display: none;
            position: absolute;
            bottom: 140px;
            left: 16px;
            right: 16px;
            height: 120px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--dev-color);
            border-radius: 12px;
            z-index: 6;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #00ff00;
            overflow-y: auto;
        }

        .chat-panel {
            width: 340px;
            background-color: var(--bg-panel);
            border-left: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #2d3748;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-dark);
        }

        .msg-block {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-system { background: rgba(31, 41, 55, 0.6); color: var(--text-muted); align-self: center; font-size: 12px; text-align: center; }
        .msg-me { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-partner { background: var(--bg-card); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; }

        .chat-input-wrapper {
            padding: 12px;
            border-top: 1px solid #2d3748;
            display: flex;
            gap: 8px;
            background-color: var(--bg-panel);
        }

        .mobile-nav {
            display: none;
            width: 100%;
            height: 60px;
            background-color: var(--bg-panel);
            border-top: 1px solid #2d3748;
            z-index: 20;
            grid-template-columns: repeat(3, 1fr);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            gap: 2px;
        }

        .nav-item.active { color: var(--accent); }
        .nav-item span { font-size: 18px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 15, 0.96); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); padding: 20px; }
        .modal-card { background: var(--bg-panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 360px; border: 1px solid #374151; text-align: center; }
        .modal-card h2 { margin-bottom: 15px; font-weight: 800; font-size: 20px; }

        @media (max-width: 992px) {
            .mobile-nav { display: grid; }
            .side-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: translateX(-100%); border-right: none; }
            .chat-panel { position: absolute; top: 0; right: 0; width: 100%; height: 100%; transform: translateX(100%); border-left: none; }
            .side-panel.active-tab, .chat-panel.active-tab { transform: translateX(0); }
            .local-video-wrapper { width: 85px; height: 115px; top: 70px; right: 12px; }
            .partner-info-overlay { left: 12px; top: 12px; }
            .bottom-controls { bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="side-panel" id="tabFilters">
            <div class="logo-area">
                <h1 id="appTitle">TalkNow Pro</h1>
                <div class="status-badge"><div class="status-dot"></div><span>Online</span></div>
            </div>
            <div class="search-options">
                <div class="option-group">
                    <div class="section-title">Я шукаю</div>
                    <select id="searchGender">
                        <option value="Всі">Всіх підряд 🌍</option>
                        <option value="Жінка">Тільки Дівчат 🙋‍♀️</option>
                        <option value="Чоловік">Тільки Хлопців 🙋‍♂️</option>
                    </select>
                </div>
                <div class="option-group">
                    <div class="section-title">Моя стать</div>
                    <select id="myGender">
                        <option value="Чоловік">Я Хлопець 🙋‍♂️</option>
                        <option value="Жінка">Я Дівчина 🙋‍♀️</option>
                    </select>
                </div>
                <div class="option-group">
                    <div class="section-title">Моя Країна</div>
                    <select id="myCountry">
                        <option value="🇺🇦 Україна">🇺🇦 Україна</option>
                        <option value="🇺🇸 США">🇺🇸 США</option>
                        <option value="🇵🇱 Польща">🇵🇱 Польща</option>
                        <option value="🇩🇪 Німеччина">🇩🇪 Німеччина</option>
                    </select>
                </div>
                <div class="option-group">
                    <div class="section-title">Мій вік</div>
                    <input type="number" id="myAge" value="20" min="18" max="99">
                </div>
            </div>
        </div>

        <div class="main-content" id="tabVideo">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>
                <div class="local-video-wrapper">
                    <video id="localVideo" autoplay playsinline webkit-playsinline muted></video>
                </div>
                <div class="partner-info-overlay" id="partnerInfo"><span>Натисніть кнопку пошуку... 🔎</span></div>
                <div class="developer-badge" id="devBadge">CREATOR MODE</div>
                <div class="dev-console" id="devConsole"></div>
            </div>
            <div class="bottom-controls">
                <button id="btnAudio" class="btn btn-circle" onclick="toggleAudio()">🎙️</button>
                <button id="btnVideo" class="btn btn-circle" onclick="toggleVideo()">📹</button>
                <button id="btnNext" class="btn btn-primary" onclick="nextPartner()">Наступний ⚡</button>
            </div>
        </div>

        <div class="chat-panel" id="tabChat">
            <div class="chat-header">
                <span>Чат кімната</span>
                <span style="font-size: 12px; color: var(--accent);" id="chatStatus">очікування</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="msg-block msg-system">Система запущена. Очікування дій користувача.</div>
            </div>
            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Повідомлення...">
                <button class="btn btn-circle" style="border-radius:12px; width:48px; height:48px; background:var(--bg-card);" onclick="sendChatMessage()">➡️</button>
            </div>
        </div>
    </div>

    <div class="mobile-nav">
        <div class="nav-item" id="navItemFilters" onclick="switchMobileTab('filters')"><span>⚙️</span>Фільтри</div>
        <div class="nav-item active" id="navItemVideo" onclick="switchMobileTab('video')"><span>📹</span>Відео</div>
        <div class="nav-item" id="navItemChat" onclick="switchMobileTab('chat')"><span>💬</span>Чат</div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-card">
            <h2>Вхід у систему</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Введіть ім'я. Для активації панелі Creator введіть `Адмін`.</p>
            <div style="text-align: left; margin-bottom: 15px;">
                <input type="text" id="usernameInput" value="Гість">
            </div>
