<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkNow Pro — Відеочат</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff4a5a;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Головна сітка як у Camloo */
        .app-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ЛІВА ПАНЕЛЬ: НАЛАШТУВАННЯ ПОШУКУ */
        .side-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--success);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .search-options {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        select, input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        /* ЦЕНТРАЛЬНА ЧАСТИНА: ВІДЕОПЛЕЄР */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000;
        }

        .video-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            background: #05070f;
        }

        /* Велике відео співрозмовника на весь екран */
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #05070f;
        }

        /* Маленьке відео "Я" поверх великого */
        .local-video-wrapper {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #000;
            z-index: 5;
            transition: all 0.3s;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .partner-info-overlay {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: rgba(17, 24, 39, 0.75);
            padding: 10px 18px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            z-index: 4;
        }

        /* Нижня панель керування */
        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(9,13,22,0.95) 70%, rgba(9,13,22,0));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 4;
            padding-bottom: 10px;
        }

        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: #fff;
            font-size: 20px;
            border: 1px solid #374151;
        }

        .btn-circle:hover {
            background-color: #374151;
            transform: scale(1.05);
        }

        .btn-circle.off {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .btn-primary {
            height: 50px;
            padding: 0 35px;
            border-radius: 25px;
            background: var(--accent-gradient);
            color: #000;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        /* ПРАВА ПАНЕЛЬ: ТЕКСТОВИЙ ЧАТ */
        .chat-panel {
            width: 340px;
            background-color: var(--bg-panel);
            border-left: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #2d3748;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-block {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-system {
            background: rgba(55, 65, 81, 0.5);
            color: var(--text-muted);
            align-self: center;
            font-size: 12px;
            text-align: center;
            max-width: 95%;
        }
        
        .msg-error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            align-self: center;
            font-size: 13px;
        }

        .msg-me {
            background: #2563eb;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-partner {
            background: var(--bg-card);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }

        .chat-input-wrapper {
            padding: 14px;
            border-top: 1px solid #2d3748;
            display: flex;
            gap: 8px;
        }

        .chat-input-wrapper input {
            flex: 1;
            padding: 12px;
        }

        .btn-send {
            width: 46px;
            height: 46px;
            background: var(--bg-card);
            border: 1px solid #374151;
            border-radius: 10px;
            color: var(--accent);
            font-size: 16px;
        }

        /* АДАПТИВНІСТЬ ДЛЯ МОБІЛЬНИХ ПРИСТРОЇВ (Екрани ховаються у вкладки) */
        @media (max-width: 992px) {
            .side-panel { display: none; }
            .chat-panel { display: none; }
            .local-video-wrapper { width: 110px; height: 85px; top: 15px; right: 15px; }
        }

        /* МОДАЛЬНЕ ВІКНО АВТОРИЗАЦІЇ */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 15, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .modal-card { background: var(--bg-panel); padding: 30px; border-radius: 20px; width: 100%; max-width: 380px; border: 1px solid #374151; text-align: center; }
        .modal-card h2 { margin-bottom: 20px; font-weight: 800; }
        .modal-card .btn-primary { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <script>
        // Примусовий HTTPS редірект
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
    </script>

    <div class="app-wrapper">
        
        <div class="side-panel">
            <div class="logo-area">
                <h1>TalkNow Pro</h1>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
            </div>

            <div class="search-options">
                <div class="option-group">
                    <div class="section-title">Я шукаю</div>
                    <select id="searchGender">
                        <option value="Всі">Дівчат та Хлопців 🌍</option>
                        <option value="Жінка">Тільки Дівчат 🙋‍♀️</option>
                        <option value="Чоловік">Тільки Хлопців 🙋‍♂️</option>
                    </select>
                </div>

                <div class="option-group">
                    <div class="section-title">Моя стать</div>
                    <select id="myGender">
                        <option value="Чоловік">Я Хлопець 🙋‍♂️</option>
                        <option value="Жінка">Я Дівчина 🙋‍♀️</option>
                    </select>
                </div>

                <div class="option-group">
                    <div class="section-title">Мій вік</div>
                    <input type="number" id="myAge" value="20" min="18" max="99">
                </div>
                
                <div class="option-group" style="margin-top: auto;">
                    <div class="section-title" style="text-align: center;">Мова інтерфейсу</div>
                    <select id="langSelect">
                        <option value="uk">🇺🇦 Українська</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                
                <div class="local-video-wrapper">
                    <video id="localVideo" autoplay playsinline muted></video>
                </div>

                <div class="partner-info-overlay" id="partnerInfo">
                    <span style="color: var(--text-muted)">Очікування пошуку...</span>
                </div>
            </div>

            <div class="bottom-controls">
                <button id="btnAudio" class="btn btn-circle" onclick="toggleAudio()">🎙️</button>
                <button id="btnVideo" class="btn btn-circle" onclick="toggleVideo()">📹</button>
                <button id="btnNext" class="btn btn-primary" onclick="nextPartner()">Шукати наступного ⚡</button>
            </div>
        </div>

        <div class="chat-panel">
            <div class="chat-header">
                <span>Текстовий чат</span>
                <span style="font-size: 12px; color: var(--accent);" id="chatStatus">вільний</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="msg-block msg-system">Вітаємо у TalkNow! Натисніть кнопку «Шукати», щоб знайти пару.</div>
            </div>

            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Напишіть повідомлення...">
                <button class="btn btn-send" onclick="sendChatMessage()">➡️</button>
            </div>
        </div>

    </div>

    <div class="modal" id="authModal">
        <div class="modal-card">
            <h2>Вхід в чат</h2>
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 12px; color: var(--text-muted); display:block; margin-bottom:5px;">Ваше ім'я чи нікнейм</label>
                <input type="text" id="usernameInput" value="Гість">
            </div>
            <button class="btn btn-primary" onclick="closeAuthModal()">Увійти в чат 🚀</button>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        let socket;
        let myId = Math.random().toString(36).substr(2, 9);
        let loggedInUser = null;

        const configuration = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:relay.metered.ca:80', username: 'openwebrtc', credential: 'openwebrtc_bypass' },
                { urls: 'turn:relay.metered.ca:443', username: 'openwebrtc', credential: 'openwebrtc_bypass' }
            ] 
        };

        function closeAuthModal() {
            const name = document.getElementById('usernameInput').value.trim() || "Гість";
            loggedInUser = {
                name: name,
                gender: document.getElementById('myGender').value,
                age: document.getElementById('myAge').value,
                searchGender: document.getElementById('searchGender').value
            };
            document.getElementById('authModal').style.display = 'none';
            initWebSocket(loggedInUser);
        }

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) { 
                appendSystemMessage(`Помилка камери: ${e.name}. Будь ласка, увімкніть камеру в налаштуваннях та використовуйте HTTPS!`, true);
            }
        }

        function initWebSocket(profile) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: profile }));
            };

            socket.onmessage = async (message) => {
                const data = JSON.parse(message.data);

                if (data.type === 'waiting') {
                    document.getElementById('partnerInfo').innerHTML = `<span style="color:var(--accent)">Шукаємо когось підходящого... 🔍</span>`;
                    document.getElementById('chatStatus').innerText = "пошук...";
                }

                if (data.type === 'connected') {
                    const p = data.partnerProfile;
                    document.getElementById('partnerInfo').innerHTML = `🇺🇦 <strong>${p.name}, ${p.age} р. (${p.gender})</strong>`;
                    document.getElementById('chatStatus').innerText = "у мережі";
                    appendSystemMessage(`Система: Вас з'єднано з ${p.name}`);
                    startCall(true);
                }

                if (data.type === 'partner_disconnected') {
                    appendSystemMessage("Система: Співрозмовник відключився.");
                    closeCall();
                }

                if (data.type === 'chat_message') {
                    appendMessage("partner", data.text);
                }

                if (data.type === 'offer') {
                    await startCall(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify(peerConnection.localDescription));
                }

                if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }

                if (data.type === 'candidate') {
                    if (peerConnection) {
                        try {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                        } catch(e) {}
                    }
                }
            };
        }

        async function startCall(isCaller) {
            peerConnection = new RTCPeerConnection(configuration);
            
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify(peerConnection.localDescription));
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'message', text: text }));
                appendMessage("me", text);
                input.value = "";
            }
        }

        function appendMessage(type, text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg-block ${type === 'me' ? 'msg-me' : 'msg-partner'}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function appendSystemMessage(text, isError = false) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg-block ${isError ? 'msg-error' : 'msg-system'}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function nextPartner() {
            closeCall();
            document.getElementById('chatMessages').innerHTML = "";
            if (socket && socket.readyState === WebSocket.OPEN) {
                // Оновлюємо фільтри перед пошуком нового партнера
                loggedInUser.searchGender = document.getElementById('searchGender').value;
                loggedInUser.gender = document.getElementById('myGender').value;
                loggedInUser.age = document.getElementById('myAge').value;
                
                socket.send(JSON.stringify({ type: 'next', profile: loggedInUser }));
            }
        }

        function closeCall() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('partnerInfo').innerHTML = `<span style="color: var(--text-muted)">Очікування пошуку...</span>`;
        }

        function toggleAudio() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                document.getElementById('btnAudio').classList.toggle('off', !track.enabled);
                document.getElementById('btnAudio').innerText = track.enabled ? "🎙️" : "🔇";
            }
        }

        function toggleVideo() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track) {
                track.enabled = !track.enabled;
                document.getElementById('btnVideo').classList.toggle('off', !track.enabled);
                document.getElementById('btnVideo').innerText = track.enabled ? "📹" : "🚫";
            }
        }

        initCamera();
        document.getElementById('chatInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendChatMessage(); });
    </script>
</body>
</html>
