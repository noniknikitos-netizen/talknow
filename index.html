<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TalkNow Pro — Надійний Відеозв'язок</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --accent: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff4a5a;
            --success: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
        }

        .app-wrapper {
            display: flex;
            flex: 1;
            width: 100vw;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* ЛІВА ПАНЕЛЬ: ФІЛЬТРИ */
        .side-panel {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 22px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--success);
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
        }

        .search-options {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        select, input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid #374151;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        /* ЦЕНТР: ВІДЕОПЛЕЄР */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000;
            height: 100%;
        }

        .video-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #05070f;
        }

        .local-video-wrapper {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 105px;
            height: 140px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: #000;
            z-index: 5;
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .partner-info-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(17, 24, 39, 0.85);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 4;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bottom-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 4;
            padding: 0 16px;
        }

        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .btn-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(31, 41, 55, 0.9);
            color: #fff;
            font-size: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .btn-circle.off { background-color: var(--danger); }

        .btn-primary {
            height: 50px;
            flex: 1;
            max-width: 240px;
            border-radius: 25px;
            background: var(--accent-gradient);
            color: #000;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        /* ПРАВА ПАНЕЛЬ: ЧАТ */
        .chat-panel {
            width: 340px;
            background-color: var(--bg-panel);
            border-left: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #2d3748;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-dark);
        }

        .msg-block {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-system { background: rgba(31, 41, 55, 0.6); color: var(--text-muted); align-self: center; font-size: 12px; text-align: center; }
        .msg-me { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-partner { background: var(--bg-card); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; }

        .chat-input-wrapper {
            padding: 12px;
            border-top: 1px solid #2d3748;
            display: flex;
            gap: 8px;
            background-color: var(--bg-panel);
        }

        /* МУЛЬТИБАР ДЛЯ МОБІЛОК */
        .mobile-nav {
            display: none;
            width: 100%;
            height: 60px;
            background-color: var(--bg-panel);
            border-top: 1px solid #2d3748;
            z-index: 20;
            grid-template-columns: repeat(3, 1fr);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            gap: 2px;
        }

        .nav-item.active { color: var(--accent); }
        .nav-item span { font-size: 18px; }

        /* ВХІДНЕ МОДАЛЬНЕ ВІКНО */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 15, 0.96); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(10px); padding: 20px; }
        .modal-card { background: var(--bg-panel); padding: 24px; border-radius: 24px; width: 100%; max-width: 360px; border: 1px solid #374151; text-align: center; }
        .modal-card h2 { margin-bottom: 15px; font-weight: 800; font-size: 20px; }

        @media (max-width: 992px) {
            .mobile-nav { display: grid; }

            .side-panel {
                position: absolute;
                top: 0; left: 0; width: 100%; height: 100%;
                transform: translateX(-100%);
                border-right: none;
            }

            .chat-panel {
                position: absolute;
                top: 0; right: 0; width: 100%; height: 100%;
                transform: translateX(100%);
                border-left: none;
            }

            .side-panel.active-tab, .chat-panel.active-tab { transform: translateX(0); }
            .local-video-wrapper { width: 85px; height: 115px; top: 70px; right: 12px; }
            .partner-info-overlay { left: 12px; top: 12px; }
            .bottom-controls { bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        
        <div class="side-panel" id="tabFilters">
            <div class="logo-area">
                <h1 id="appTitle">TalkNow Pro</h1>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
            </div>

            <div class="search-options">
                <div class="option-group">
                    <div class="section-title">Я шукаю</div>
                    <select id="searchGender">
                        <option value="Всі">Всіх підряд 🌍</option>
                        <option value="Жінка">Тільки Дівчат 🙋‍♀️</option>
                        <option value="Чоловік">Тільки Хлопців 🙋‍♂️</option>
                    </select>
                </div>

                <div class="option-group">
                    <div class="section-title">Моя стать</div>
                    <select id="myGender">
                        <option value="Чоловік">Я Хлопець 🙋‍♂️</option>
                        <option value="Жінка">Я Дівчина 🙋‍♀️</option>
                    </select>
                </div>

                <div class="option-group">
                    <div class="section-title">Моя Країна</div>
                    <select id="myCountry">
                        <option value="🇺🇦 Україна">🇺🇦 Україна</option>
                        <option value="🇺🇸 США">🇺🇸 США</option>
                        <option value="🇵🇱 Польща">🇵🇱 Польща</option>
                        <option value="🇩🇪 Німеччина">🇩🇪 Німеччина</option>
                    </select>
                </div>

                <div class="option-group">
                    <div class="section-title">Мій вік</div>
                    <input type="number" id="myAge" value="20" min="18" max="99">
                </div>
            </div>
        </div>

        <div class="main-content" id="tabVideo">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline webkit-playsinline></video>
                
                <div class="local-video-wrapper">
                    <video id="localVideo" autoplay playsinline webkit-playsinline muted></video>
                </div>

                <div class="partner-info-overlay" id="partnerInfo">
                    <span>Натисніть кнопку пошуку... 🔎</span>
                </div>
            </div>

            <div class="bottom-controls">
                <button id="btnAudio" class="btn btn-circle" onclick="toggleAudio()">🎙️</button>
                <button id="btnVideo" class="btn btn-circle" onclick="toggleVideo()">📹</button>
                <button id="btnNext" class="btn btn-primary" onclick="nextPartner()">Наступний ⚡</button>
            </div>
        </div>

        <div class="chat-panel" id="tabChat">
            <div class="chat-header">
                <span>Чат кімната</span>
                <span style="font-size: 12px; color: var(--accent);" id="chatStatus">очікування</span>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="msg-block msg-system">Система готова. Натисніть кнопку пошуку.</div>
            </div>

            <div class="chat-input-wrapper">
                <input type="text" id="chatInput" placeholder="Повідомлення...">
                <button class="btn btn-circle" style="border-radius: 12px; width:48px; height:48px; background:var(--bg-card);" onclick="sendChatMessage()">➡️</button>
            </div>
        </div>

    </div>

    <div class="mobile-nav">
        <div class="nav-item" id="navItemFilters" onclick="switchMobileTab('filters')"><span>⚙️</span>Фільтри</div>
        <div class="nav-item active" id="navItemVideo" onclick="switchMobileTab('video')"><span>📹</span>Відео</div>
        <div class="nav-item" id="navItemChat" onclick="switchMobileTab('chat')"><span>💬</span>Чат</div>
    </div>

    <div class="modal" id="authModal">
        <div class="modal-card">
            <h2>Вхід у систему</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Введіть нікнейм для початку спілкування.</p>
            <div style="text-align: left; margin-bottom: 15px;">
                <input type="text" id="usernameInput" placeholder="Ваше ім'я..." value="Гість">
            </div>
            <button class="btn btn-primary" style="max-width:100%; width:100%;" onclick="closeAuthModal()">Увійти в чат 🚀</button>
        </div>
    </div>

    <script>
        let localStream;
        let peerConnection;
        let socket;
        let myId = Math.random().toString(36).substr(2, 9);
        let loggedInUser = null;

        // Покращена глобальна конфігурація WebRTC (Використовуємо стабільні STUN сервери від Google + Anyfirewall)
        const configuration = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun.anyfirewall.com:3478' }
            ],
            iceCandidatePoolSize: 10
        };

        function switchMobileTab(tabName) {
            document.getElementById('navItemFilters').classList.remove('active');
            document.getElementById('navItemVideo').classList.remove('active');
            document.getElementById('navItemChat').classList.remove('active');
            document.getElementById('tabFilters').classList.remove('active-tab');
            document.getElementById('tabChat').classList.remove('active-tab');

            if (tabName === 'filters') {
                document.getElementById('navItemFilters').classList.add('active');
                document.getElementById('tabFilters').classList.add('active-tab');
            } else if (tabName === 'chat') {
                document.getElementById('navItemChat').classList.add('active');
                document.getElementById('tabChat').classList.add('active-tab');
            } else {
                document.getElementById('navItemVideo').classList.add('active');
            }
        }

        function closeAuthModal() {
            const name = document.getElementById('usernameInput').value.trim() || "Гість";
            
            // Фікс політики автоплею звуку в мобільних браузерах (Safari, Chrome)
            try { window.AudioContext = window.AudioContext || window.webkitAudioContext; new AudioContext(); } catch(e){}

            loggedInUser = {
                name: name,
                gender: document.getElementById('myGender').value,
                age: document.getElementById('myAge').value,
                country: document.getElementById('myCountry').value,
                searchGender: document.getElementById('searchGender').value
            };

            document.getElementById('authModal').style.display = 'none';
            initWebSocket(loggedInUser);
        }

        async function initCamera() {
            try {
                // Оптимальні параметри запиту камери для швидкого підвантаження на смартфонах
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24 } }, 
                    audio: true 
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) { 
                console.error(`Помилка камери: ${e.name}`);
                appendSystemMessage(`Помилка! Перевірте дозволи на камеру/мікрофон у налаштуваннях браузера.`, true);
            }
        }

        function initWebSocket(profile) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${window.location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'join', userId: myId, profile: profile }));
            };

            socket.onmessage = async (message) => {
                const data = JSON.parse(message.data);

                if (data.type === 'waiting') {
                    document.getElementById('partnerInfo').innerHTML = `<span>Пошук людей... 🔍</span>`;
                    document.getElementById('chatStatus').innerText = "у пошуку";
                }

                if (data.type === 'connected') {
                    const p = data.partnerProfile;
                    document.getElementById('partnerInfo').innerHTML = `<span>${p.country} <strong>${p.name}, ${p.age} р.</strong></span>`;
                    document.getElementById('chatStatus').innerText = "активний";
                    appendSystemMessage(`Підключено: ${p.name} з ${p.country}`);
                    switchMobileTab('video');
                    startCall(true);
                }

                if (data.type === 'partner_disconnected') {
                    appendSystemMessage("Співрозмовник вийшов з чату.");
                    closeCall();
                }

                if (data.type === 'chat_message') {
                    appendMessage("partner", data.text);
                }

                if (data.type === 'offer') {
                    await startCall(false);
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify(peerConnection.localDescription));
                }

                if (data.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                }

                if (data.type === 'candidate') {
                    if (peerConnection && data.candidate) {
                        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                    }
                }
            };
        }

        async function startCall(isCaller) {
            if (peerConnection) { peerConnection.close(); }
            
            peerConnection = new RTCPeerConnection(configuration);
            
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            // Надійна обробка віддаленого потоку відео/аудіо
            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remoteVideo');
                if (event.streams && event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                    // Примусовий запуск відтворення (критично для iOS)
                    remoteVideo.play().catch(err => console.log(`Автоплей відхилено: ${err}`));
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
                }
            };

            // Автоматичний ICE-перезапуск у разі падіння мережі
            peerConnection.oniceconnectionstatechange = () => {
                if (peerConnection.iceConnectionState === 'failed' || peerConnection.iceConnectionState === 'disconnected') {
                    if (isCaller) {
                        peerConnection.createOffer({ iceRestart: true })
                            .then(offer => peerConnection.setLocalDescription(offer))
                            .then(() => socket.send(JSON.stringify(peerConnection.localDescription)));
                    }
                }
            };

            if (isCaller) {
                const offer = await peerConnection.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify(peerConnection.localDescription));
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text && socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'message', text: text }));
                appendMessage("me", text);
                input.value = "";
            }
        }

        function appendMessage(type, text) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg-block ${type === 'me' ? 'msg-me' : 'msg-partner'}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function appendSystemMessage(text, isError = false) {
            const box = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = `msg-block ${isError ? 'msg-error' : 'msg-system'}`;
            msg.innerText = text;
            box.appendChild(msg);
            box.scrollTop = box.scrollHeight;
        }

        function nextPartner() {
            closeCall();
            document.getElementById('chatMessages').innerHTML = "";
            if (socket && socket.readyState === WebSocket.OPEN) {
                loggedInUser.searchGender = document.getElementById('searchGender').value;
                loggedInUser.gender = document.getElementById('myGender').value;
                loggedInUser.age = document.getElementById('myAge').value;
                loggedInUser.country = document.getElementById('myCountry').value;
                socket.send(JSON.stringify({ type: 'next', profile: loggedInUser }));
                switchMobileTab('video');
            }
        }

        function closeCall() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('partnerInfo').innerHTML = `<span>Пошук наступного партнера... 🔎</span>`;
        }

        function toggleAudio() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            if (track) { track.enabled = !track.enabled; document.getElementById('btnAudio').classList.toggle('off', !track.enabled); }
        }

        function toggleVideo() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (track) { track.enabled = !track.enabled; document.getElementById('btnVideo').classList.toggle('off', !track.enabled); }
        }

        initCamera();
        
        // Автоматичний редірект на HTTPS (без нього мобільна камера ніколи не запуститься)
        if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
            window.location.href = window.location.href.replace('http:', 'https:');
        }
        document.getElementById('chatInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') sendChatMessage(); });
    </script>
</body>
</html>
